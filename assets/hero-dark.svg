  <animate attributeName="x" values="68;623;623;68" keyTimes="0;0.45;0.92;1" dur="9s" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;0.4 0 0.2 1" repeatCount="indefinite"/>
</rect>
<g transform="translate(64,322)"><rect width="264" height="30" rx="15" fill="#161B22" stroke="#30363D"/><text x="132" y="20" text-anchor="middle" class="chip">Founder @ Madhigen Technologies</text></g><g transform="translate(338,322)"><rect width="203" height="30" rx="15" fill="#161B22" stroke="#30363D"/><text x="101" y="20" text-anchor="middle" class="chip">AI agents in production</text></g><g transform="translate(550,322)"><rect width="150" height="30" rx="15" fill="#161B22" stroke="#30363D"/><text x="75" y="20" text-anchor="middle" class="chip">India · UTC+5:30</text></g>
</g>

