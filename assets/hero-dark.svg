<circle r="3" fill="#FF5A5F"><animateMotion dur="2.40s" repeatCount="indefinite" path="M960.0,60.0 L960,210"/><animate attributeName="opacity" values="0;1;1;0" dur="2.40s" repeatCount="indefinite"/></circle><circle r="3" fill="#8B5CF6"><animateMotion dur="2.75s" repeatCount="indefinite" path="M1089.9,135.0 L960,210"/><animate attributeName="opacity" values="0;1;1;0" dur="2.75s" repeatCount="indefinite"/></circle><circle r="3" fill="#22D3EE"><animateMotion dur="3.10s" repeatCount="indefinite" path="M1089.9,285.0 L960,210"/><animate attributeName="opacity" values="0;1;1;0" dur="3.10s" repeatCount="indefinite"/></circle><circle r="3" fill="#FF5A5F"><animateMotion dur="3.45s" repeatCount="indefinite" path="M960.0,360.0 L960,210"/><animate attributeName="opacity" values="0;1;1;0" dur="3.45s" repeatCount="indefinite"/></circle><circle r="3" fill="#8B5CF6"><animateMotion dur="3.80s" repeatCount="indefinite" path="M830.1,285.0 L960,210"/><animate attributeName="opacity" values="0;1;1;0" dur="3.80s" repeatCount="indefinite"/></circle><circle r="3" fill="#22D3EE"><animateMotion dur="4.15s" repeatCount="indefinite" path="M830.1,135.0 L960,210"/><animate attributeName="opacity" values="0;1;1;0" dur="4.15s" repeatCount="indefinite"/></circle>
<circle cx="960" cy="210" r="34" fill="url(#core)"><animate attributeName="r" values="32;37;32" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="960" cy="210" r="34" fill="none" stroke="#8B5CF6" opacity="0.5"><animate attributeName="r" values="34;70" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/></circle>
<text x="960" y="217" text-anchor="middle" style="font: 800 20px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #fff;">&gt;_</text>
