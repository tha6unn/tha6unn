<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Tharun S: Founder · Full-stack engineer · AI-native builder">
<title>Tharun S: Founder · Full-stack engineer · AI-native builder</title>
<defs>
<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FF5A5F"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
<radialGradient id="glow1"><stop offset="0%" stop-color="#FF5A5F" stop-opacity="0.35"/><stop offset="100%" stop-color="#FF5A5F" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="core"><stop offset="0%" stop-color="#22D3EE"/><stop offset="60%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#FF5A5F"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1F2630" stroke-width="1"/></pattern>
<clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
<clipPath id="typed"><rect x="64" y="246" height="36" width="0">
  <animate attributeName="width" values="0;555;555;0" keyTimes="0;0.45;0.92;1" dur="9s" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;0.4 0 0.2 1" repeatCount="indefinite"/>
</rect></clipPath>
</defs>
<style>
.name { font: 800 68px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #E6EDF3; letter-spacing: -1.5px; }
.role { font: 600 23px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#accent); }
.cmd { font: 500 18px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8B949E; }
.cmd .p { fill: #3FB950; }
.hello { font: 600 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8B949E; letter-spacing: 1px; }
.chip { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #E6EDF3; }
.orbit { font: 600 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8B949E; }
.cursor { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.fade { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
.d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#card)">
<rect width="1200" height="420" fill="#0D1117"/>
<rect width="1200" height="420" fill="url(#grid)"/>
<circle cx="180" cy="40" r="340" fill="url(#glow1)"><animate attributeName="cx" values="180;260;180" dur="16s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="360" r="380" fill="url(#glow2)"><animate attributeName="cy" values="360;300;360" dur="18s" repeatCount="indefinite"/></circle>
<rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="none" stroke="#30363D"/>

<g class="fade"><text x="64" y="92" class="hello"><tspan fill="#3FB950">●</tspan> HEY, I'M</text></g>
<g class="fade d1"><text x="60" y="168" class="name">Tharun S</text></g>
<g class="fade d2"><text x="64" y="214" class="role">Founder · Full-stack engineer · AI-native builder</text></g>
<g class="fade d3">
<rect x="56" y="242" width="577" height="44" rx="10" fill="#161B22" stroke="#30363D"/>
<g clip-path="url(#typed)"><text x="68" y="270" class="cmd"><tspan class="p">$</tspan> claude --agents 8 &quot;turn this idea into a product&quot;</text></g>
