name: Refresh profile

on:
  schedule:
    - cron: "17 0 * * *" # daily, 05:47 IST
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On pull requests: prove the generators still run, using demo data.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/hero.py && git diff --exit-code assets/
      - run: python scripts/cards.py --demo --no-readme --out dist && ls dist

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PROFILE_TOKEN (optional, classic PAT with read:user + repo) lets the cards count
      # private repos and languages. Without it the built-in token sees public data only.
      - name: Build stat cards and live README sections
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/cards.py --out dist

      - name: Build contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish cards to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit refreshed README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh live profile sections [skip ci]"
          git push
